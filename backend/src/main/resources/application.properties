spring.application.name=portfolio-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# Flyway owns schema changes. Hibernate only checks mappings at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Existing databases are baselined at 0 so V1 can create missing tables and
# convert the legacy experience date columns without replacing portfolio rows.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-initial-password=${ADMIN_INITIAL_PASSWORD:}
app.bootstrap.admin-first-name=${ADMIN_FIRST_NAME:Portfolio}
app.bootstrap.admin-last-name=${ADMIN_LAST_NAME:Owner}

logging.level.root=INFO
logging.level.org.springframework.security=WARN
server.error.include-message=never
server.error.include-stacktrace=never
